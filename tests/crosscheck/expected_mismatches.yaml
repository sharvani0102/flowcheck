# Every difference between FlowCheck's IR and Lean4Agent's Layer-2 IR JSON,
# each reviewed and categorised. tests/test_crosscheck.py requires the computed
# mismatches to equal this list exactly. Refresh with scripts/crosscheck_review.py.
categories:
  IR-linearised-edges: The ELAIP IR builder links each flattened node to the next one only (experiments/elaip_LeanEvolve/build_layer2_ir.py:394-399),
    so it has no loop-back, loop-skip or branch edges, and it chains the last node of one branch to the
    first node of the next. FlowCheck models the real control flow.
  IR-instruction-only-reads: The ELAIP IR builder takes reads from `instruction` only and records none
    for set_variable (build_layer2_ir.py:243, 292). AgentSPEX template-expands set_variable `value` (variables.py:92),
    so FlowCheck counts those reads.
  IR-stale-vs-YAML: 'The YAML was changed after the IR was generated (ELAIP failed_workflow_3: rewritten
    in Lean4Agent commit 17b2099; SWE failed_workflow_2: the old `discover` step was ported to a task
    named `edge_case_list`, see the comment at failed_workflow_2.yaml:229). The IR describes the older
    workflow.'
  IR-abstraction: 'The SWE IR is a hand/LLM-authored abstraction: it omits scaffolding steps (set_variable,
    increment), merges or drops some LLM steps and an inner `if`, models for_each as whileLoop, and leaves
    out some templated reads. FlowCheck lists every step and every `{{...}}` the runtime expands.'
  IR-conceptual-read: 'The IR lists a read that the YAML never template-expands: the variable is only
    named in prose (e.g. ''Source: candidate_files_report'', ''the PR description'', a path mentioned
    in text). At runtime the value is not substituted, so FlowCheck has no read. (Several of these are
    exactly what FC004 is meant to flag.)'
  IR-conceptual-write: The IR lists a write, but the YAML step has no save_as, so nothing is written at
    runtime.
  IR-runtime-ignores: 'The IR lists the read a broken construct was meant to perform, but AgentSPEX never
    performs it: the condition uses the unsupported `contains` operator (always false, conditions.py:142-206),
    or the switch has no `variable` key because YAML parsed `on:` as a boolean (control.py:405-417). FlowCheck
    reports these as FC005 instead.'
  IR-type-label: The IR labels the step with a different step type than the YAML uses.
