missed_issues:
- file: discover_arxiv_research.yaml
  line: 43
  issue: 'for_each `limit: "{{max_papers}}"`: limit is not template-expanded, and iteration_list[:"{{max_papers}}"]
    raises TypeError (control.py:175-176), so the whole loop step fails. The semantics doc records this
    (§3.9), but no FlowCheck rule checks it; an FC005 trap for a non-integer limit would. Found while
    reviewing, not added during evaluation.'
no_findings_review: 'deep_research_with_module/ (main + 5 modules) and slack_templates/default.yaml have
  no findings. Reading them: every {{...}} read is a declared parameter, a loop variable, or a save_as
  written earlier, module-form parallel blocks set max_workers, and modules return values through `return:`.
  Their remaining risks (JSON shape of LLM outputs, parameters passed as strings) are field-level and
  out of scope for phase one.'
