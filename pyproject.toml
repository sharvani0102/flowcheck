[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flowcheck"
version = "0.1.0"
description = "Static checker for AgentSPEX agent workflows: finds steps that assume information they were never given."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sharvani Sinha" }]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
flowcheck = "flowcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
